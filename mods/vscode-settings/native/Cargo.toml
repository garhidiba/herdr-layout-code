[workspace]
members = ["vscode-core", "vscode-textmate", "vsedit"]
# A plain `cargo build` (and install.sh) builds only vscode-core; vscode-textmate (and vsedit, the editor on it)
# compile Oniguruma's C sources.
default-members = ["vscode-core"]
resolver = "2"

[profile.release]
strip = true
lto = "thin"
